<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.22.17/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    const IconAward = () => (
      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
          d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
      </svg>
    );

    const IconChart = () => (
      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    );

    function App() {
      const [view, setView]               = useState('home');
      const [loading, setLoading]         = useState(false);
      const [error, setError]             = useState('');
      const [session, setSession]         = useState(null);
      const [sessionId, setSessionId]     = useState('');

      // Formulari de creació
      const [profEmail, setProfEmail]     = useState('');
      const [baseGrade, setBaseGrade]     = useState('');
      const [members, setMembers]         = useState([{ name: '', email: '' }, { name: '', email: '' }]);
      const [mode, setMode]               = useState(null);

      // Formulari de votació
      const [voterName, setVoterName]         = useState('');
      const [myVotes, setMyVotes]             = useState({});
      const [myJustification, setMyJustification] = useState('');

      const selectMode = (m) => { setMode(m); setError(''); setView('setup'); };

      // ---- Handlers --------------------------------------------------------

      const createSession = () => {
        if (!profEmail || members.some(m => !m.name || !m.email)) {
          setError('Falten dades dels alumnes o l\'email del professor.');
          return;
        }
        setError('');
        setLoading(true);
        google.script.run
          .withSuccessHandler((res) => {
            setSession(res);
            setSessionId(res.id);
            setView('created');
            setLoading(false);
          })
          .withFailureHandler((err) => {
            setError(err.message || 'Error en crear la sessió.');
            setLoading(false);
          })
          .createNewSession({ mode, profEmail, baseGrade, members });
      };

      const loadSession = (id) => {
        const trimmed = (id || '').trim();
        if (!trimmed) { setError('Introdueix un codi de sessió.'); return; }
        setError('');
        setLoading(true);
        google.script.run
          .withSuccessHandler((res) => {
            if (res) {
              setSession(res);
              setSessionId(trimmed);
              setView('vote');
            } else {
              setError('Sessió no trobada. Comprova el codi.');
            }
            setLoading(false);
          })
          .withFailureHandler((err) => {
            setError(err.message || 'Error en carregar la sessió.');
            setLoading(false);
          })
          .getSessionData(trimmed);
      };

      const submitVote = () => {
        if (!voterName) { setError('Selecciona qui ets abans de votar.'); return; }
        setError('');
        setLoading(true);
        google.script.run
          .withSuccessHandler(() => { setLoading(false); setView('thanks'); })
          .withFailureHandler((err) => { setError(err.message); setLoading(false); })
          .submitUserVote({ sessionId, voterName, scores: myVotes, justification: myJustification });
      };

      const updateMember = (i, field, value) => {
        const updated = [...members];
        updated[i][field] = value;
        setMembers(updated);
      };

      const removeMember = (i) => setMembers(members.filter((_, j) => j !== i));

      // ---- Shared components -----------------------------------------------

      const ErrorMsg = () => error
        ? <p className="text-red-500 text-sm mt-3 p-3 bg-red-50 rounded-xl">{error}</p>
        : null;

      // ---- Views -----------------------------------------------------------

      if (view === 'home') return (
        <div className="flex flex-col items-center justify-center min-h-screen p-6 animate-fade-in text-center">
          <h1 className="text-4xl font-extrabold text-slate-900 mb-2">Coevaluació</h1>
          <p className="text-slate-500 mb-12">Selecciona el mètode per al teu equip</p>

          <div className="grid md:grid-cols-2 gap-6 w-full max-w-2xl mb-12">
            <button onClick={() => selectMode('bolsa')}
              className="bg-white p-8 rounded-[32px] border-2 hover:border-blue-500 text-left group transition-all shadow-sm">
              <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                <IconAward />
              </div>
              <b className="text-xl block">Borsa de Punts</b>
              <p className="text-sm text-slate-400 mt-2">Repartiment de la nota total entre integrants.</p>
            </button>

            <button onClick={() => selectMode('coeficient')}
              className="bg-white p-8 rounded-[32px] border-2 hover:border-emerald-500 text-left group transition-all shadow-sm">
              <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                <IconChart />
              </div>
              <b className="text-xl block">Coeficients</b>
              <p className="text-sm text-slate-400 mt-2">Multiplicadors individuals d'esforç.</p>
            </button>
          </div>

          <div className="bg-white p-4 rounded-2xl shadow-sm border w-full max-w-md">
            <p className="text-sm text-slate-500 mb-3 font-medium">Ja tens un codi? Entra a votar</p>
            <input
              type="text"
              placeholder="Codi de sessió..."
              className="w-full p-3 bg-slate-50 rounded-xl mb-3 border text-center uppercase font-mono"
              onChange={e => { setSessionId(e.target.value); setError(''); }}
            />
            <button
              onClick={() => loadSession(sessionId)}
              disabled={loading}
              className="w-full bg-slate-900 text-white p-3 rounded-xl font-bold disabled:opacity-50">
              {loading ? 'Carregant...' : 'Entrar a Votar'}
            </button>
            <ErrorMsg />
          </div>
        </div>
      );

      if (view === 'setup') return (
        <div className="max-w-2xl mx-auto p-6 py-12 animate-fade-in">
          <div className="bg-white p-8 rounded-[40px] shadow-sm border">
            <button onClick={() => setView('home')} className="text-slate-400 text-sm mb-6 block">← Tornar</button>
            <h2 className="text-2xl font-bold mb-6">
              Configurar Equip — <span className="text-blue-600">{mode}</span>
            </h2>

            <div className="space-y-6">
              <div className="grid md:grid-cols-2 gap-4">
                <input
                  type="email"
                  placeholder="Email del Professor"
                  className="p-4 rounded-2xl border focus:outline-none focus:ring-2 focus:ring-blue-300"
                  onChange={e => setProfEmail(e.target.value)}
                />
                {mode === 'bolsa' && (
                  <input
                    type="number"
                    min="0" max="10" step="0.1"
                    placeholder="Nota del Professor (0–10)"
                    className="p-4 rounded-2xl border bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-300"
                    onChange={e => setBaseGrade(e.target.value)}
                  />
                )}
              </div>

              <div className="space-y-3">
                {members.map((m, i) => (
                  <div key={i} className="flex gap-2 items-center">
                    <input
                      placeholder="Nom"
                      value={m.name}
                      className="flex-1 p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-300"
                      onChange={e => updateMember(i, 'name', e.target.value)}
                    />
                    <input
                      placeholder="Email alumne"
                      value={m.email}
                      className="flex-1 p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-300"
                      onChange={e => updateMember(i, 'email', e.target.value)}
                    />
                    {members.length > 2 && (
                      <button
                        onClick={() => removeMember(i)}
                        className="text-red-400 font-bold px-2 hover:text-red-600">✕</button>
                    )}
                  </div>
                ))}
              </div>

              <button
                onClick={() => setMembers([...members, { name: '', email: '' }])}
                className="text-blue-600 font-bold text-sm">
                + Afegir alumne
              </button>

              <ErrorMsg />

              <button
                onClick={createSession}
                disabled={loading}
                className="w-full bg-blue-600 text-white p-5 rounded-[24px] font-bold disabled:opacity-50 hover:bg-blue-700 transition-colors">
                {loading ? 'Creant sessió...' : 'Activar i Enviar Emails'}
              </button>
            </div>
          </div>
        </div>
      );

      if (view === 'vote') return (
        <div className="max-w-md mx-auto p-6 py-12 animate-fade-in">
          <h2 className="text-2xl font-bold mb-2">Votació</h2>
          <p className="text-slate-500 text-sm mb-8">Mètode: <b>{session.mode}</b></p>

          <select
            className="w-full p-4 rounded-xl border mb-8 bg-white focus:outline-none focus:ring-2 focus:ring-slate-300"
            onChange={e => { setVoterName(e.target.value); setError(''); }}>
            <option value="">¿Qui ets?</option>
            {session.members.map((m, i) => (
              <option key={i} value={m.name}>{m.name}</option>
            ))}
          </select>

          <div className="space-y-4 mb-8">
            {session.mode === 'bolsa' && (
              <p className="text-sm font-bold text-blue-600">
                Borsa total: {(parseFloat(session.baseGrade || 0) * session.members.length).toFixed(1)} punts
              </p>
            )}
            {session.members.map((m, i) => (
              <div key={i} className="flex items-center justify-between p-4 bg-white rounded-2xl border shadow-sm">
                <span className="font-bold">{m.name}</span>
                <input
                  type="number"
                  step="0.1"
                  min="0"
                  placeholder={session.mode === 'bolsa' ? '0' : '1.0'}
                  className="w-20 p-2 border rounded-lg text-center font-bold focus:outline-none focus:ring-2 focus:ring-slate-300"
                  onChange={e => {
                    const v = { ...myVotes };
                    v[m.name] = e.target.value;
                    setMyVotes(v);
                  }}
                />
              </div>
            ))}
          </div>

          <textarea
            className="w-full p-4 rounded-xl border mb-4 h-24 focus:outline-none focus:ring-2 focus:ring-slate-300"
            placeholder="Justificació (Opcional)"
            onChange={e => setMyJustification(e.target.value)}>
          </textarea>

          <ErrorMsg />

          <button
            onClick={submitVote}
            disabled={loading || !voterName}
            className="w-full bg-slate-900 text-white p-4 rounded-xl font-bold mt-4 disabled:opacity-50 hover:bg-slate-700 transition-colors">
            {loading ? 'Enviant...' : 'Confirmar Votació'}
          </button>
        </div>
      );

      if (view === 'thanks') return (
        <div className="max-w-md mx-auto p-6 py-24 text-center animate-fade-in">
          <div className="text-5xl mb-6">✓</div>
          <h2 className="text-3xl font-bold mb-4">Votat!</h2>
          <p className="text-slate-500 font-medium leading-relaxed">
            La teva valoració s'ha guardat correctament.<br/>
            El professor rebrà l'informe quan tots hagin acabat.
          </p>
        </div>
      );

      if (view === 'created') return (
        <div className="max-w-md mx-auto p-6 py-24 text-center animate-fade-in">
          <div className="bg-white p-8 rounded-[40px] shadow-sm border">
            <div className="text-4xl mb-4">🎉</div>
            <h2 className="text-2xl font-bold mb-4">Sessió Activada!</h2>
            <p className="text-slate-400 mb-8">
              Els alumnes han rebut un email amb l'accés. Comparteix també el codi:
            </p>
            <div className="text-4xl font-black text-blue-600 bg-blue-50 p-6 rounded-2xl mb-8 tracking-widest uppercase">
              {sessionId}
            </div>
            <button
              onClick={() => setView('home')}
              className="text-slate-400 font-bold hover:text-slate-600">
              Tornar a l'inici
            </button>
          </div>
        </div>
      );

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
